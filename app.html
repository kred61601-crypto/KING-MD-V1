<script>
// ===== FIXED TABS + BLUE TICK POPUP + AUTO REACT BOT =====
function openTickPopup(username, isVerified){
  const popup = document.getElementById('tickPopup');
  popup.style.display = 'flex';
  const extra = document.getElementById('tickPopupExtra');
  extra.innerHTML = isVerified ? '@' + username + ' has Premium verification ✔️' : 'You don\'t have verification yet';
}
function closeTickPopup(){ document.getElementById('tickPopup').style.display='none'; }
function goPremium(){
  closeTickPopup();
  if(window.EH && EH.go) return EH.go('premium');
  window.location.href = '/premium.html';
}
document.getElementById('tickPopup').addEventListener('click', e=>{
  if(e.target.id === 'tickPopup') closeTickPopup();
});

// Force tabs to work on phone touch + click
document.addEventListener('DOMContentLoaded', ()=>{
  const nav = document.querySelector('nav.tabs');
  if(nav) nav.classList.remove('off');
  document.querySelectorAll('.tab').forEach(tab=>{
    const go = (e)=>{
      const name = tab.getAttribute('data-tab') || tab.getAttribute('data-go');
      if(!name) return;
      // Let EH handle it first
      if(window.EH && EH.go){
        try{ EH.go(name); return; }catch(err){}
      }
      // Fallback: show screen manually
      document.querySelectorAll('#stack > div').forEach(d=> d.style.display='none');
      let screen = document.getElementById('screen-' + name) || document.querySelector('[data-screen="' + name + '"]');
      if(screen) screen.style.display='block';
    };
    tab.addEventListener('click', go);
  });
});

// Helper to make blue tick clickable anywhere
function blueTick(username, isVerified){
  if(!isVerified) return '';
  return '<span onclick="openTickPopup(\'' + username + '\', true)" style="cursor:pointer;color:#1DA1F2;font-weight:900;">✔️</span>';
}
</script>
